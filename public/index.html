<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Touchpoints</title>
<script>try{var t=localStorage.getItem('hyros_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--brand:#5150f6;--bg:#eeeefb;--card:#fff;--raised:#f6f6fe;--text:#1d1d3a;--muted:#55557a;--line:rgba(81,80,246,.22);--accent:#2f2fb8;--btn-hover:#e4e4fb;--logo-filter:none;--band:#e9e9fb;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14142b;--card:#1e1e3d;--raised:#25254a;--text:#eeeefb;--muted:#b5b5dc;--line:rgba(255,255,255,.18);--accent:#cfcffd;--btn-hover:#2f2f5c;--logo-filter:brightness(1.35);--band:#1c1c3d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14142b;--card:#1e1e3d;--raised:#25254a;--text:#eeeefb;--muted:#b5b5dc;--line:rgba(255,255,255,.18);--accent:#cfcffd;--btn-hover:#2f2f5c;--logo-filter:brightness(1.35);--band:#1c1c3d;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}.bg path{fill:var(--band)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:none;margin:0 auto;padding:20px clamp(16px,2vw,40px) 24px;position:relative;min-height:100vh;display:flex;flex-direction:column}
.themebtn{position:absolute;top:22px;right:clamp(16px,2vw,40px);display:flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--text);cursor:pointer;z-index:1}
.themebtn:hover{background:var(--btn-hover)}
.brand{margin:0 0 16px}.brand img{display:block;height:40px;width:auto;filter:var(--logo-filter)}
h1{font-size:28px;line-height:1.25;font-weight:600;margin:0 0 9px}
h2{font-size:13px;font-weight:600;margin:28px 0 8px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.content{flex:1}
button{font:inherit;cursor:pointer}
.note{color:var(--muted);font-size:12px;margin-top:6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.sum{padding:0 14px 14px}
.sum h2{margin-top:12px}
.top2{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:900px){.top2{grid-template-columns:minmax(0,1fr)}}
h2.big{font-size:20px;margin-top:32px}
.note.lg{font-size:14px}
.cards .tp{width:96px;flex:none;padding:6px 4px}
.cards.conv{flex-wrap:nowrap}
.tp .n{font-size:14px;font-weight:600;opacity:1;color:inherit}
.tp .rv{font-size:11px;font-weight:500;opacity:.9}
.tp{position:relative;min-width:0;height:58px;border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1px}
.tp b{max-width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}
.tp i{font-size:16px}
.tp span{font-size:11px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.k-meta{background:#1877f2;color:#fff}
.k-google{background:linear-gradient(135deg,#fde68a 0 25%,#bfdbfe 25% 50%,#fecaca 50% 75%,#bbf7d0 75%);color:#1f2937;border:1px solid rgba(0,0,0,.08)}
.k-tiktok{background:#111;color:#fff;border:1px solid #3a3a3a}
.k-reddit{background:#ff4500;color:#fff}
.k-snapchat{background:#fffc00;color:#111}
.k-applovin{background:#0e7490;color:#fff}
.k-youtube{background:#b91c1c;color:#fff}
.k-linkedin{background:#0a3d62;color:#fff}
.k-pinterest{background:#be123c;color:#fff}
.k-x{background:#334155;color:#fff}
.k-affiliate{background:#ea580c;color:#fff}
.k-organic{background:#7e22ce;color:#fff}
.k-call{background:#f5c518;color:#1f1700}
.k-purchase{background:#16a34a;color:#fff}
.k-other{background:#4b5563;color:#fff}
.chip{width:118px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:600}
.jr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.jr:last-child{border:none}
.jr .n{width:18px;color:var(--muted);font-size:12px}
.jr .p{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:var(--muted)}
.jr .c{color:var(--muted);font-size:12px;white-space:nowrap}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.row{display:grid;grid-template-columns:200px repeat(var(--n),96px);gap:16px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);min-width:calc(200px + var(--n) * 112px)}
.row:last-child{border:none}
.em{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd{text-align:center;color:var(--muted);font-size:12px}
.row>.tp::before{content:'›';position:absolute;left:-13px;top:50%;transform:translateY(-50%);width:10px;text-align:center;color:var(--muted)}
.row>.em+.tp::before{content:none}
.demo{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--brand);color:#fff;margin-left:8px;vertical-align:middle}
.actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;width:max-content;max-width:100%;margin:32px auto 0}
@media (max-width:540px){.actions{grid-auto-flow:row;width:100%;max-width:280px}}
.actions a{display:block;text-align:center;padding:9px 22px;border:1.5px solid var(--brand);border-radius:8px;color:var(--accent);font-size:15px;font-weight:600;text-decoration:none}
.actions a:hover{background:var(--brand);color:#fff}
.actions a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>

    paths[key].n++;
  });
  order.sort(function(a,b){return counts[b].n-counts[a].n});
  var cards=order.map(function(k){var t=counts[k].t;return '<div class="tp k-'+t.kind+'"><b><i class="ti '+icon(t)+'"></i>'+esc(k)+'</b><span class="n">'+counts[k].n+'</span></div>'}).join('');
  var top=Object.keys(paths).map(function(k){return paths[k]}).sort(function(a,b){return b.n-a.n}).slice(0,5);
  var jr=top.map(function(p,i){return '<div class="jr"><span class="n">'+(i+1)+'</span><div class="p">'+p.tps.map(chip).join(' › ')+'</div><span class="c">'+p.n+(p.n===1?' lead':' leads')+'</span></div>'}).join('');
  var max=leads.reduce(function(m,l){return Math.max(m,l.touchpoints.length)},1);
  var head='<div class="row"><div class="em" style="color:var(--muted)">Lead</div>';
  for(var i=1;i<=max;i++){head+='<div class="hd">Touchpoint '+i+'</div>'}
  head+='</div>';
  var rows=leads.map(function(l){return '<div class="row"><div class="em" title="'+esc(l.email)+'">'+esc(l.email)+'</div>'+l.touchpoints.map(card).join('')+'</div>'}).join('');
  document.getElementById('out').innerHTML=
    '<div class="top2"><div class="box sum"><h2>Conversions</h2><div class="cards conv">'+
      '<div class="tp k-purchase"><b><i class="ti ti-credit-card"></i>Sales</b><span class="n">'+buys+' <span class="rv">($'+rev.toLocaleString('en-US')+')</span></span></div>'+
      '<div class="tp k-call"><b><i class="ti ti-phone-call"></i>Booked calls</b><span class="n">'+calls+'</span></div>'+
    '</div></div>'+
    '<div class="box sum"><h2>Touchpoints per source</h2><div class="cards">'+cards+'</div></div></div>'+
    '<h2 class="big">Top 5 journeys</h2><div class="box">'+jr+'</div>'+
    '<div class="note lg">Journeys are grouped by source type only. Leads who touched the same kinds of sources in the same order count as one journey, even if the specific ad or email was different. See the table below for exact ad and email names.</div>'+
    '<h2>Leads</h2><div class="tbl" style="--n:'+max+'">'+head+rows+'</div>';
}
render(window.DEMO);
var root=document.documentElement,mq=window.matchMedia('(prefers-color-scheme: dark)');
function curTheme(){return root.getAttribute('data-theme')||(mq.matches?'dark':'light')}
function setHid(el,h){if(h)el.setAttribute('hidden','');else el.removeAttribute('hidden')}
function paintTheme(){var d=curTheme()==='dark';setHid(document.getElementById('i-sun'),!d);setHid(document.getElementById('i-moon'),d);document.getElementById('themebtn').setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode')}
document.getElementById('themebtn').addEventListener('click',function(){var n=curTheme()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('hyros_theme',n)}catch(e){}paintTheme()});
mq.addEventListener&&mq.addEventListener('change',paintTheme);
paintTheme();
</script>
