<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Touchpoints</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#0f1117;--panel:#171a22;--line:#2a2f3a;--text:#f2f4f8;--muted:#9aa3b2}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fa;--panel:#fff;--line:#e2e5ec;--text:#14171f;--muted:#5d6676}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:none;margin:0 auto;padding:24px clamp(16px,2vw,40px) 64px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
h2{font-size:13px;font-weight:600;margin:28px 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.gate{max-width:420px;margin:12vh auto 0;text-align:center}
.gate form{display:flex;gap:8px;margin-top:16px}
.gate input{flex:1;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 12px;font:inherit}
.gate button,.top button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--text);color:var(--bg);padding:0 16px;font:inherit;font-weight:600;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.top button{height:32px;background:var(--panel);color:var(--text);padding:0 12px}
.err{color:#f87171;font-size:13px;min-height:18px;margin-top:8px}
.note{color:var(--muted);font-size:12px;margin-top:6px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sc{height:80px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);background:var(--panel)}
.sc small{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sc b{font-size:24px;font-weight:600}
.tp{position:relative;min-width:0;height:58px;border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1px}
.tp b{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.tp i{font-size:16px}
.tp span{font-size:11px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.k-meta{background:#1877f2;color:#fff}
.k-google{background:linear-gradient(135deg,#fde68a 0 25%,#bfdbfe 25% 50%,#fecaca 50% 75%,#bbf7d0 75%);color:#1f2937;border:1px solid rgba(0,0,0,.08)}
.k-tiktok{background:#111;color:#fff;border:1px solid #3a3a3a}
.k-reddit{background:#ff4500;color:#fff}
.k-snapchat{background:#fffc00;color:#111}
.k-applovin{background:#0e7490;color:#fff}
.k-youtube{background:#b91c1c;color:#fff}
.k-linkedin{background:#0a3d62;color:#fff}
.k-pinterest{background:#be123c;color:#fff}
.k-x{background:#334155;color:#fff}
.k-affiliate{background:#ea580c;color:#fff}
.k-organic{background:#7c3aed;color:#fff}
.k-call{background:#f5c518;color:#1f1700}
.k-purchase{background:#16a34a;color:#fff}
.k-other{background:#4b5563;color:#fff}
.chip{width:118px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:600}
.jr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.jr:last-child{border:none}
.jr .n{width:18px;color:var(--muted);font-size:12px}
.jr .p{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:var(--muted)}
.jr .c{color:var(--muted);font-size:12px;white-space:nowrap}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.row{display:grid;grid-template-columns:200px repeat(var(--n),minmax(130px,240px));gap:16px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);min-width:calc(200px + var(--n) * 146px)}
.row:last-child{border:none}
.em{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd{text-align:center;color:var(--muted);font-size:12px}
.row>.tp::before{content:'›';position:absolute;left:-13px;top:50%;transform:translateY(-50%);width:10px;text-align:center;color:var(--muted)}
.row>.em+.tp::before{content:none}
.demo{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#7c3aed;color:#fff;margin-left:8px;vertical-align:middle}
</style>
</head>
<body>
<main>
  <section id="gate" class="gate">
    <h1>Lead Touchpoints</h1>
    <p class="sub">Enter a product ID to see every touchpoint, lead by lead.</p>
    <form id="form">
      <input id="pid" inputmode="numeric" pattern="[0-9]*" placeholder="Product ID, for example 217087" aria-label="Product ID" autofocus>
      <button type="submit">Open report</button>
    </form>
    <div id="err" class="err"></div>
  </section>
  <section id="report" hidden>
    <div class="top">
      <h1>Lead Touchpoints<span class="demo">Demo data</span></h1>
      <button id="back" type="button">Change product ID</button>
    </div>
    <p class="sub" id="sub"></p>
    <div id="out"></div>
  </section>
</main>
<script src="demo.js"></script>
<script>
var ICON={meta:'ti-brand-meta',google:'ti-brand-google',tiktok:'ti-brand-tiktok',reddit:'ti-brand-reddit',snapchat:'ti-brand-snapchat',applovin:'ti-apps',youtube:'ti-brand-youtube',linkedin:'ti-brand-linkedin',pinterest:'ti-brand-pinterest',x:'ti-brand-x',affiliate:'ti-users-group',call:'ti-phone-call',purchase:'ti-credit-card',other:'ti-world'};
var LABEL_ICON={'Google organic':'ti-brand-google','Facebook organic':'ti-brand-facebook','Instagram organic':'ti-brand-instagram','TikTok organic':'ti-brand-tiktok','Email':'ti-mail','SMS':'ti-message-2','Manychat':'ti-message-circle','Organic':'ti-leaf'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function icon(t){return LABEL_ICON[t.label]||ICON[t.kind]||'ti-world'}
function card(t){return '<div class="tp k-'+t.kind+'" title="'+esc(t.tip||t.detail)+'"><b><i class="ti '+icon(t)+'"></i>'+esc(t.label)+'</b><span>'+esc(t.detail)+'</span></div>'}
function chip(t){return '<span class="chip k-'+t.kind+'"><i class="ti '+icon(t)+'"></i>'+esc(t.label==='Purchase made'?'Purchase':t.label)+'</span>'}
function render(d,pid){
  var leads=d.leads||[],counts={},order=[],paths={};
  leads.forEach(function(l){
    l.touchpoints.forEach(function(t){
      if(!counts[t.label]){counts[t.label]={n:0,t:t};order.push(t.label)}
      counts[t.label].n++;
    });
    var key=l.touchpoints.map(function(t){return t.label}).join('>');
    if(!paths[key])paths[key]={n:0,tps:l.touchpoints};
    paths[key].n++;
  });
  order.sort(function(a,b){return counts[b].n-counts[a].n});
  var cards=order.map(function(k){var t=counts[k].t;return '<div class="sc"><small><i class="ti '+icon(t)+'"></i>'+esc(k)+'</small><b>'+counts[k].n+'</b></div>'}).join('');
  var top=Object.keys(paths).map(function(k){return paths[k]}).sort(function(a,b){return b.n-a.n}).slice(0,5);
  var jr=top.map(function(p,i){return '<div class="jr"><span class="n">'+(i+1)+'</span><div class="p">'+p.tps.map(chip).join(' › ')+'</div><span class="c">'+p.n+(p.n===1?' lead':' leads')+'</span></div>'}).join('');
  var max=leads.reduce(function(m,l){return Math.max(m,l.touchpoints.length)},1);
  var head='<div class="row"><div class="em" style="color:var(--muted)">Lead</div>';
  for(var i=1;i<=max;i++){head+='<div class="hd">Touchpoint '+i+'</div>'}
  head+='</div>';
  var rows=leads.map(function(l){return '<div class="row"><div class="em" title="'+esc(l.email)+'">'+esc(l.email)+'</div>'+l.touchpoints.map(card).join('')+'</div>'}).join('');
  var skipped=d.skippedNoAttribution||0;
  var foot='These are '+leads.length+' made up leads with attribution. '+skipped+' other leads created in the same period had no attribution and were left out.';
  document.getElementById('sub').textContent='Product ID '+pid+'. One row per lead, one card per touchpoint, in the order they happened.';
  document.getElementById('out').innerHTML=
    '<h2>Touchpoints per source</h2><div class="cards">'+cards+'</div>'+
    '<h2>Top 5 journeys</h2><div class="box">'+jr+'</div>'+
    '<div class="note">Journeys are grouped by source type only. Leads who touched the same kinds of sources in the same order count as one journey, even if the specific ad or email was different. See the table below for exact ad and email names.</div>'+
    '<h2>Leads</h2><div class="tbl" style="--n:'+max+'">'+head+rows+'</div><div class="note">'+foot+'</div>';
}
document.getElementById('form').onsubmit=function(e){
  e.preventDefault();
  var pid=document.getElementById('pid').value.trim();
  if(!/^\d{4,10}$/.test(pid)){document.getElementById('err').textContent='Enter a numeric product ID.';return}
  document.getElementById('err').textContent='';
  render(window.DEMO,pid);
  document.getElementById('gate').hidden=true;
  document.getElementById('report').hidden=false;
};
document.getElementById('back').onclick=function(){
  document.getElementById('report').hidden=true;
  document.getElementById('gate').hidden=false;
  document.getElementById('pid').focus();
};
</script>
</body>
</html>
